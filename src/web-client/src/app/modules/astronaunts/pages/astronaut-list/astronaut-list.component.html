<div class="text-center bg-slate-300 overflow-auto">
  <section>
    <h1 class="mb-4 text-3xl leading-none tracking-tight font-extrabold text-gray-900 md:text-5xl lg:text-6xl">
      <span class="text-transparent bg-clip-text bg-gradient-to-r to-emerald-600 from-sky-400">People</span>
    </h1>
    <div *ngIf="(astronautsService.isLoadingAstronauts$ | async) === false"
      class="flex flex-col items-center justify-center w-full">
      <table mat-table [dataSource]="(astronautsService.allAstronauts$ | async)" class="mat-elevation-z8 demo-table"
        multiTemplateDataRows>
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Id</th>
          <td mat-cell *matCellDef="let element">{{ element.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Astronaut Name</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>
        <ng-container matColumnDef="rank">
          <th mat-header-cell *matHeaderCellDef>Rank</th>
          <td mat-cell *matCellDef="let element">{{ element.rank }}</td>
        </ng-container>
        <ng-container matColumnDef="currentDutyTitle">
          <th mat-header-cell *matHeaderCellDef>Current Duty Title</th>
          <td mat-cell *matCellDef="let element">{{ element.currentDutyTitle }}</td>
        </ng-container>
        <ng-container matColumnDef="careerStartDate">
          <th mat-header-cell *matHeaderCellDef>careerStartDate</th>
          <td mat-cell *matCellDef="let element">{{ element.careerStartDate | date: 'short' }}</td>
        </ng-container>
        <ng-container matColumnDef="careerEndDate">
          <th mat-header-cell *matHeaderCellDef>careerEndDate</th>
          <td mat-cell *matCellDef="let element">{{ element.careerEndDate | date: 'short' }}</td>
        </ng-container>
        <ng-container matColumnDef="duties">
          <th mat-header-cell *matHeaderCellDef>Duties</th>
          <td mat-cell *matCellDef="let element">
            <ul>
              <li *ngFor="let duty of element.duties">
                {{ duty.dutyTitle }}
              </li>
            </ul>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="person-row"></tr>
      </table>
    </div>
  </section>
</div>
